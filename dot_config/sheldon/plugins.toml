shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.compinit]
inline = '''
autoload -Uz compinit

# compaudit is relatively expensive. Check it once a day, while continuing to
# load the existing completion dump on every shell startup.
zcompdump_old=("${ZDOTDIR:-$HOME}"/.zcompdump(N.mh+24))
if (( $#zcompdump_old )); then
  compinit
else
  compinit -C
fi
unset zcompdump_old
'''

[plugins.config-sync]
local = "~/.config/zsh/sync"

[plugins.config-async]
local = "~/.config/zsh/async"
apply = ["defer"]

[plugins.starship]
inline = 'eval "$(starship init zsh)"'

[plugins.fzf-scripts]
github = "junegunn/fzf"
use = ["shell/key-bindings.zsh", "shell/completion.zsh"]

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]
apply = ["defer"]

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]
