shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.cache]
inline = '''
zmodload -F zsh/stat b:zstat

# Several tools below are initialised by evaluating a script they print, which
# costs a subprocess per shell. The output only changes when the tool or its
# config does, so it is cached on disk and this decides when to rebuild.
#
# Nix stamps every store file with mtime 1, so the usual `$binary -nt $cache`
# test never fires here. What nixos-rebuild actually re-points is the
# /run/current-system symlink, so its own mtime -- read without following it --
# is the honest key on NixOS. Elsewhere the binaries' own mtimes work fine.
zsh-cache-stale() {
  local cache=$1; shift
  [[ -f $cache ]] || return 0
  local -a c s
  zstat -A c +mtime -- $cache 2>/dev/null || return 0
  if [[ -L /run/current-system ]] && zstat -L -A s +mtime -- /run/current-system 2>/dev/null; then
    (( s[1] > c[1] )) && return 0
  fi
  # The generator for every derived cache is an inline block in plugins.toml,
  # which sheldon re-renders into this file. Editing that config has to
  # invalidate what it produces, so treat it as an input to all of them.
  local f
  for f in ${XDG_CACHE_HOME:-$HOME/.cache}/zsh/sheldon.zsh $@; do
    zstat -A s +mtime -- $f 2>/dev/null && (( s[1] > c[1] )) && return 0
  done
  return 1
}
'''

# Extra completion functions for tools that ship none. fpath has to be complete
# before compinit runs, so this stays ahead of it and off the defer path.
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]

[plugins.compinit]
inline = '''
autoload -Uz compinit

# compaudit is relatively expensive. Check it once a day, while continuing to
# load the existing completion dump on every shell startup. The dump is also
# zcompiled, which roughly halves the time spent reading it back.
() {
  local dump=${ZDOTDIR:-$HOME}/.zcompdump
  # The dump itself is a poor stamp: compinit leaves the file untouched when
  # its contents have not changed, so its mtime can sit behind the inputs
  # below forever and every shell would take the slow path. The .zwc is
  # rewritten unconditionally after each full run, so key the decision on it.
  # Glob qualifiers do not expand inside [[ ]], so test freshness via an array.
  # Use the plain qualifier form: (#q...) would require extended_glob.
  local -a fresh=( $dump.zwc(N.mh-24) )
  # fpath is decided by the plugin set, so a re-rendered sheldon.zsh -- or a
  # new system generation, which is what brings new completion files -- has to
  # rebuild the dump as surely as the daily compaudit does.
  if (( $#fresh )) && ! zsh-cache-stale $dump.zwc; then
    compinit -C -d $dump
  else
    compinit -d $dump
    zcompile -R -- $dump
  fi
}
'''

[plugins.config-sync]
local = "~/.config/zsh/sync"

[plugins.config-async]
local = "~/.config/zsh/async"
apply = ["defer"]

[plugins.starship]
inline = '''
# `starship init zsh` spawns starship once, and the PROMPT2 line inside its
# output spawns it a second time. Neither depends on anything but the binary
# and starship.toml, so cache the whole thing with PROMPT2 already resolved.
() {
  local cache=${XDG_CACHE_HOME:-$HOME/.cache}/zsh/starship.zsh
  local conf=${STARSHIP_CONFIG:-${XDG_CONFIG_HOME:-$HOME/.config}/starship.toml}
  # Resolve the binary with the :c modifier rather than $commands[...]; touching
  # that array hashes every executable on PATH, which costs ~40ms here.
  if zsh-cache-stale $cache ${${:-starship}:c} $conf; then
    mkdir -p $cache:h
    {
      starship init zsh | grep -v '^PROMPT2='
      printf 'PROMPT2=%q\n' "$(starship prompt --continuation)"
    } >| $cache
    zcompile -R -- $cache
  fi
  source $cache
}
'''

# Ctrl-R / Ctrl-T stay synchronous so they work on the very first prompt.
[plugins.fzf-key-bindings]
github = "junegunn/fzf"
use = ["shell/key-bindings.zsh"]

# Loaded after fzf so atuin wins the contest for Ctrl-R. Cached for the same
# reason starship is: each of these init scripts costs a subprocess to print.
[plugins.tool-init]
inline = '''
# zoxide and direnv only define functions and hooks, so they are cheap enough
# to keep on the critical path.
() {
  local cache=${XDG_CACHE_HOME:-$HOME/.cache}/zsh/tools.zsh
  if zsh-cache-stale $cache ${${:-zoxide}:c} ${${:-direnv}:c} ${${:-dircolors}:c}; then
    mkdir -p $cache:h
    {
      whence -p zoxide >/dev/null && zoxide init zsh
      whence -p direnv >/dev/null && direnv hook zsh
      # LS_COLORS は ls だけでなく、補完候補の色分け（completion.zsh の
      # list-colors）と eza の既定配色にも使われる。
      whence -p dircolors >/dev/null && dircolors -b
    } >| $cache
    zcompile -R -- $cache
  fi
  source $cache
}

# atuin is a different story: its init mints a session id by shelling out to
# `atuin uuid`, which costs ~14ms here -- more than the whole rest of startup.
# Caching cannot help, because every shell needs its own id. Nothing reads the
# session until the first command is recorded, so defer the lot. Running at ZLE
# idle also puts it after fzf's key bindings, which is what lets it win Ctrl-R.
() {
  local cache=${XDG_CACHE_HOME:-$HOME/.cache}/zsh/atuin.zsh
  whence -p atuin >/dev/null || return
  if zsh-cache-stale $cache ${${:-atuin}:c}; then
    mkdir -p $cache:h
    {
      # Up-arrow stays plain zsh history; atuin only takes over Ctrl-R.
      atuin init zsh --disable-up-arrow
      # atuin also binds `?` on an empty line to its hosted AI assistant.
      # There is no flag for that, so hand the key back to self-insert.
      print -r -- "bindkey '?' self-insert"
    } >| $cache
    zcompile -R -- $cache
  fi
  zsh-defer source $cache
}
'''

# The `**<TAB>` trigger is only needed once completion is actually used.
[plugins.fzf-completion]
github = "junegunn/fzf"
use = ["shell/completion.zsh"]
apply = ["defer"]

[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"
apply = ["defer"]

[plugins.mise]
inline = '''
# mise's initial environment scan is expensive and isn't needed to draw the
# first prompt. Run it as soon as ZLE becomes idle. The `whence -p` guard goes
# inside the deferred command on purpose: looking up a command that is not on
# PATH walks every directory in it, which costs more than everything else in
# this file put together.
zsh-defer -c 'whence -p mise >/dev/null && eval "$(mise activate zsh)"'
'''

# Syntax highlighting wraps ZLE widgets, so it goes first: autosuggestions runs
# with ZSH_AUTOSUGGEST_MANUAL_REBIND and only binds its widgets once, at load.
[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]
apply = ["defer"]
